<title>Corner Office</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#141a2e; --bg2:#0e1222; --panel:#1d2440; --panel2:#262e52; --line:#343d66;
  --text:#f1ede4; --muted:#8e97b8; --amber:#f5b54a; --mint:#5fd3a6; --red:#f0716b;

}
html,body{height:100%;margin:0}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{padding:10px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted)}

#scene{position:relative;flex:0 0 auto;height:min(42vh,380px);touch-action:none;background:#0e1222;overflow:hidden;border-bottom:1px solid var(--line)}

.client{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--amber);color:#2a1d05;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:11px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 6px rgba(245,181,74,.25),0 6px 16px rgba(0,0,0,.5);animation:bob 1.2s ease-in-out infinite}

.list{display:flex;flex-direction:column;gap:10px}

.wide{width:100%;min-width:0}

.tools .buy small{white-space:normal;max-width:none}
.outline-red{box-shadow:inset 0 0 0 1px var(--red);color:var(--red)}

.sw.paint i{display:block;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.paints{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.text-in{width:100%;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;box-sizing:border-box}
.text-in:focus{outline:2px solid var(--amber);outline-offset:1px}
.tsum{display:flex;flex-direction:column;gap:6px;margin-top:6px;overflow-x:auto}
.trow{display:grid;grid-template-columns:minmax(92px,1.3fr) 26px minmax(70px,2fr) minmax(52px,.9fr) 40px;gap:8px;align-items:center;font-size:12px}
.thead{color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tname b{font-family:"Chakra Petch",sans-serif;margin-right:2px}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px 0;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}

.satchip{display:inline-block;padding:1px 6px;border-radius:999px;color:#14192b;font-size:11px;font-weight:800;vertical-align:1px}
.notes{margin-top:2px;line-height:1.35}
.emp-t{flex-wrap:wrap;gap:2px 8px;align-items:center}.emp-t .nm{white-space:nowrap;font-weight:800}
.fire{margin-top:6px;font-size:11px;font-weight:700;color:var(--red);padding:3px 8px;border-radius:999px;border:1px solid rgba(240,113,107,.5)}
.offer{border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(240,113,107,.4)}.offer h2{color:var(--red)}
nav button.alert{position:relative}nav button.alert::after{content:'';position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.req{border-color:var(--amber)}.req h2{color:var(--amber)}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}.reqs small{color:var(--muted)}.hint2{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}.chk input{width:18px;height:18px;accent-color:#f5b54a}
.prog:disabled{opacity:.55}
.tiers-tbl{display:flex;flex-direction:column;gap:6px}
.trow2{display:grid;grid-template-columns:minmax(0,1.2fr) auto;grid-template-rows:auto auto;column-gap:10px;background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:12px}
.trow2 .tn2 b{display:block;font-family:"Chakra Petch",sans-serif;font-size:13px}.trow2 .tn2 small{color:var(--muted)}
.trow2 .tv{font-weight:800;text-align:right;align-self:center}.trow2 .ts{grid-column:1/-1;margin-top:3px}.trow2.dim{opacity:.6}.lock{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}.acts .buy{min-width:112px}.buy.train{background:#2b4a66;color:#d6ecff}.buy.train:disabled{background:var(--panel2);color:var(--muted)}
.repbar{display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.repbar .rl{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10px}
.repbar .rb{position:relative;flex:1 1 40px;min-width:28px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.repbar .rb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .4s}
.repbar .rb .tg{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--text);opacity:.55}
.repbar b{color:var(--text)}.repbar .rv{overflow:hidden;text-overflow:ellipsis}
.repbar .rd{font-weight:800}.repbar .rd.up{color:var(--mint)}.repbar .rd.dn{color:var(--red)}
.ipo-grid{display:grid;grid-template-columns:1fr auto;gap:4px 0;font-size:13px;color:var(--muted);margin:6px 0 10px}.ipo-grid b{color:var(--text);text-align:right}
.ipo-grid span{padding-right:12px}.ipo-grid .tot{border-top:1px solid var(--line);padding-top:4px}
.capstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 16px 8px;background:var(--bg2);border-bottom:1px solid var(--line);cursor:pointer}
.cap-sum{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.cap-sum .sumtxt{flex:1;min-width:0}
.dots{display:flex;gap:3px;flex:none}.dot{display:block;width:8px;height:8px;border-radius:50%}.dot.g{background:var(--mint)}.dot.r{background:var(--red);box-shadow:0 0 0 2px rgba(240,113,107,.3)}.dot.m{background:var(--muted)}.dot.l{background:transparent;border:1.5px solid var(--line)}
.capstrip:not(.collapsed) .dots{display:none}
.capT{flex:none;width:30px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;line-height:1}
.capstrip.collapsed{padding-block:5px}.capstrip.collapsed .sumtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.cap-col #scene{height:min(48vh,400px)}.cap-sum b{color:var(--text)}
.chip2{flex:none;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;color:#14192b}.chip2.r{background:var(--red)}.chip2.a{background:var(--amber)}.chip2.g{background:var(--mint)}
.cp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:10.5px;line-height:1.25;min-width:0}
.cp b{display:block;font-family:"Chakra Petch",sans-serif;font-size:11.5px}.cp .nums{display:block;color:var(--text);font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cp .mb{display:flex;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:3px 0}.cp .mb i{display:block;height:100%}

.cp .st{display:block;color:var(--mint);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp .st.r{color:var(--red)}
.cp.bad{border-color:var(--red)}.cp.lock{opacity:.45}.cp.lock .st{color:var(--muted)}
.cph{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}.cph b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgl{flex:none;position:relative;width:26px;height:15px;border-radius:999px;background:var(--mint);vertical-align:middle;margin-left:4px;padding:0}
.tgl i{position:absolute;top:2px;left:13px;width:11px;height:11px;border-radius:50%;background:#14192b;transition:left .15s}
.tgl.is-off{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}.tgl.is-off i{left:2px;background:var(--muted)}
.cp.off{opacity:.55}.cp.off .st{color:var(--muted)}.trow2.dim .tgl{opacity:1}
.overbg{position:fixed;inset:0;z-index:8;background:rgba(6,8,16,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.overbg[hidden]{display:none}
.overcard{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--amber);border-radius:18px;padding:20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.6);text-align:center}
.overcard .k{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.overcard h2{margin:6px 0 2px;font-size:20px}
.overcard .big{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:42px;line-height:1.1;color:var(--amber);margin:4px 0}

.overcard .ipo-grid{text-align:left}

.overcard .btns{display:flex;flex-direction:column;gap:8px}

.overpill[hidden]{display:none}.is-over .hint{display:none}
.helpcard{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;z-index:6;background:#1f2748;border:1px solid #b18cff;border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.55);font-size:13px}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.hc-top b{font-family:"Chakra Petch",sans-serif;font-size:15px;color:#d9c9ff}
.hc-x{width:28px;height:28px;border-radius:8px;background:var(--panel2);color:var(--text)}

.hc-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.hc-foot .chk{margin:0;flex:1}.hc-foot .buy{min-width:0;padding:8px 12px}

.toast{display:flex;align-items:center;gap:10px;text-align:left;width:max-content;max-width:min(90vw,420px);box-sizing:border-box}.toast .tm{flex:1}

</style>

function nextRequest(e){if(e.dept==='exec')return null;if(!seatAssign().has(e.id))return {need:'desk',t:'a desk',hint:'Build more desks.'};

  const r=(REQS[q.need]||[]).find(x=>x.t===q.t);return r?r.ok(e):true}

const MAX_CERT=2;
function trainInfo(e){if(e.training)return {busy:true};const d=empDept(e),hd=hireDisc();

  else return {maxed:true};
  const st=sellTier(e),ns=sellTier(clone),dl=delTier(e),nd=delTier(clone);
  const unlock=ns>st?'Sells '+TIERS[ns].short:nd>dl?'Delivers '+TIERS[nd].short:kind==='onboard'?'Full speed':'+10% output';
  return {kind,cost,hours,unlock,name:kind==='onboard'?'Onboarding':'Advanced course '+((e.cert||0)+1)}}

function drawRoomOutlines(t){if(!showRooms||typeof S.view!=='number')return;const ri=roomInfo[S.view];if(!ri)return;const pulse=.65+.35*Math.sin(t/300);

function removeEmp(e){const i=S.staffList.indexOf(e);if(i>=0)S.staffList.splice(i,1);S.offers=(S.offers||[]).filter(o=>o.empId!==e.id);refreshStaff();teamSig=''}
